[project]
name = "verity-backend"
version = "1.0.0"
description = "Grounded retrieval-augmented document intelligence API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "tiktoken>=0.7.0",
    "google-genai>=0.1.1",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.9",
    "llama-index-core>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as requiring external database (deselect with '-m \"not integration\"')",
    "contract: marks OpenAPI and schema contract tests",
    "eval: marks golden evaluation tests (slow, consumes API quota)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
